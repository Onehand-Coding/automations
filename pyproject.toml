[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automations-cli"
version = "1.0.0"
description = "A collection of personal automation scripts, managed as a CLI tool."
authors = [{ name = "Onehand Coding", email = "onehand.coding433@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "typer==0.9.0",
    "click==8.1.7",
    "pysrt",
    "send2trash",
    "tqdm",
    "ffsubsync",
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth",
    "python-dotenv",
    "requests"
]

[project.scripts]
automations = "automations_cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# B008: Typer requires typer.Option()/typer.Argument() calls in defaults.
# E501: long URLs and literal strings are not wrapped by ruff format.
ignore = ["B008", "E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/automations_cli"]
